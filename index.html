<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>WG Kurswahl</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  font-family:system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background:#f4f6f8;
}
header{
  background:#111;
  color:#fff;
  padding:14px;
  text-align:center;
  position:sticky;
  top:0;
}
main{
  max-width:900px;
  margin:0 auto;
  padding:20px;
}
.section{
  background:#fff;
  border-radius:10px;
  padding:16px;
  margin-bottom:20px;
}
h2{margin-top:0}
label{
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 0;
}
input[type=checkbox]{
  transform:scale(1.2);
}
.status{
  padding:14px;
  border-radius:10px;
  font-weight:600;
}
.ok{background:#e8fff0}
.bad{background:#fff0f0}
</style>
</head>
<body>

<header>
  <strong>WG Kurswahl</strong>
</header>

<main>
  <div class="section">
    <h2>Leistungsfächer (LK)</h2>
    <p>Bitte genau <strong>2 LKs</strong> auswählen:</p>
    <label><input type="checkbox" class="lk"> Deutsch (LK)</label>
    <label><input type="checkbox" class="lk"> Mathematik (LK)</label>
    <label><input type="checkbox" class="lk"> Englisch (LK)</label>
    <label><input type="checkbox" class="lk"> Volks- & Betriebswirtschaft (LK)</label>
  </div>

  <div class="section">
    <h2>Pflichtfächer</h2>
    <label><input type="checkbox" checked disabled> Deutsch</label>
    <label><input type="checkbox" checked disabled> Mathematik</label>
    <label><input type="checkbox" checked disabled> Englisch</label>
    <label><input type="checkbox" checked disabled> Volks- & Betriebswirtschaft</label>
    <label><input type="checkbox" checked disabled> Sport</label>
  </div>

  <div class="section">
    <h2>Wahlfächer</h2>
    <label><input type="checkbox" class="elective"> Informatik</label>
    <label><input type="checkbox" class="elective"> Physik</label>
    <label><input type="checkbox" class="elective"> Chemie</label>
    <label><input type="checkbox" class="elective"> Biologie</label>
    <label><input type="checkbox" class="elective"> Geographie</label>
    <label><input type="checkbox" class="elective"> Gemeinschaftskunde</label>
    <label><input type="checkbox" class="elective"> Religion / Ethik</label>
    <label><input type="checkbox" class="elective"> Musik</label>
    <label><input type="checkbox" class="elective"> Kunst</label>
    <label><input type="checkbox" class="elective"> Französisch</label>
    <label><input type="checkbox" class="elective"> Italienisch</label>
  </div>

  <div id="status" class="status bad">Bitte Kurswahl treffen</div>
</main>

<script>
const LK_REQUIRED = 2;
const MIN = 10;
const MAX = 14;

function update(){
  const lk = document.querySelectorAll('.lk:checked').length;
  const electives = document.querySelectorAll('.elective:checked').length;
  const mandatory = 5;
  const total = mandatory + electives;

  const status = document.getElementById('status');

  if(lk !== LK_REQUIRED){
    status.textContent = `⚠️ Bitte genau ${LK_REQUIRED} Leistungsfächer wählen (aktuell: ${lk})`;
    status.className = "status bad";
    return;
  }

  if(total < MIN || total > MAX){
    status.textContent = `⚠️ Insgesamt ${MIN}–${MAX} Kurse nötig (aktuell: ${total})`;
    status.className = "status bad";
    return;
  }

  status.textContent = `✅ Kurswahl gültig – ${total} Kurse, ${lk} LKs`;
  status.className = "status ok";
}

document.querySelectorAll('input').forEach(i=>i.addEventListener('change',update));
update();
</script>

</body>
</html>
